<div class="telegram-config">
  <form [formGroup]="configForm" (ngSubmit)="onSave()">
    <div class="config-section">
      <h3>Bot Configuration</h3>

      <mat-slide-toggle formControlName="is_enabled" class="enable-toggle">
        Enable Telegram Bot
      </mat-slide-toggle>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Bot Token</mat-label>
        <input matInput formControlName="bot_token" placeholder="Enter your bot token" />
        <mat-error *ngIf="configForm.get('bot_token')?.hasError('required')">
          Bot token is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Bot Username</mat-label>
        <input matInput formControlName="bot_username" placeholder="Enter bot username" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Webhook URL</mat-label>
        <input
          matInput
          formControlName="webhook_url"
          placeholder="Webhook URL (auto-generated)"
          readonly
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Default Survey ID</mat-label>
        <input
          matInput
          type="number"
          formControlName="default_survey_id"
          placeholder="Enter default survey ID"
        />
      </mat-form-field>
    </div>

    <div class="actions">
      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="saving || configForm.invalid"
      >
        <mat-icon *ngIf="saving">hourglass_empty</mat-icon>
        {{ saving ? 'Saving...' : 'Save Configuration' }}
      </button>

      <button
        mat-raised-button
        color="accent"
        type="button"
        (click)="onSetupWebhook()"
        [disabled]="!configForm.get('bot_token')?.value"
      >
        <mat-icon>webhook</mat-icon>
        Setup Webhook
      </button>
    </div>
  </form>

  <div *ngIf="loading" class="loading-spinner">
    <mat-spinner diameter="50"></mat-spinner>
    <p>Loading configuration...</p>
  </div>
</div>
