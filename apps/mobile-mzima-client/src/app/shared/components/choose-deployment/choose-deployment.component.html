<app-main-layout
  #layout
  class="main"
  title="Deployments"
  [isSearch]="showSearch"
  [header]="isProfile"
  (back)="backHandle()"
  [placeholderText]="'Enter StreetSignal URL'"
  (search)="searchDeployments($event)"
  (searchFocus)="isSearchView = true"
  (searchBlur)="isSearchView = false"
  [ngClass]="{ 'main--profile': isProfile, 'main--search-view': isSearchView }"
>
  <app-icon
    *ngIf="!isProfile"
    class="logo"
    [ngClass]="{ 'logo--hidden': isSearchView }"
    name="streetsignal"
  ></app-icon>

  <ng-container *ngIf="deploymentList.length && !isSearchView">
    <ion-text color="medium" class="title ion-padding-horizontal">
      {{ 'app.choose_deployment' | translate }}
    </ion-text>
    <ion-list class="deployment-list">
      <app-deployment-item
        *ngFor="let item of deploymentList"
        [deployment]="item"
        (selectedDeployment)="callModal($event)"
        [isCurrent]="!item.isOutdated && item.id === currentDeploymentId"
        [isOutdated]="item.isOutdated"
        (click)="chooseDeployment(item)"
      ></app-deployment-item>
    </ion-list>
  </ng-container>

  <ng-container *ngIf="isSearchView">
    <ng-container *ngIf="!isDeploymentsLoading; else spinner">
      <ng-container *ngIf="foundDeploymentList.length; else emptyList">
        <ion-text color="medium" class="title"> StreetSignal installation found </ion-text>
        <ion-list class="search-list" [ngStyle]="{ background: 'none' }">
          <app-deployment-item
            class="search-result"
            *ngFor="let item of foundDeploymentList"
            [deployment]="item"
            [buttonVisible]="false"
            [checkboxVisible]="true"
            [isBackgroundVisible]="false"
            [isBorderVisible]="false"
            (selectedDeployment)="selectDeployment($event)"
          ></app-deployment-item>
        </ion-list>
      </ng-container>
      <ng-template #emptyList>
        <ion-text class="empty" color="medium">
          {{ 'app.locate_deployment' | translate }}
        </ion-text>

        <!-- Manual URL Entry Section -->
        <div class="manual-url-section ion-padding">
          <ion-item>
            <ion-label position="stacked">Enter StreetSignal URL manually</ion-label>
            <ion-input
              [(ngModel)]="manualUrl"
              placeholder="https://example.streetsignal.com"
              type="url"
              clearInput="true"
            ></ion-input>
          </ion-item>
          <ion-button
            expand="block"
            fill="outline"
            [disabled]="!manualUrl || manualUrl.trim().length === 0"
            (click)="submitManualUrl()"
            class="ion-margin-top"
          >
            Add StreetSignal
          </ion-button>

          <ion-button expand="block" fill="outline" (click)="addByQrCode()" class="ion-margin-top">
            <ion-icon name="qr-code" slot="start"></ion-icon>
            Add StreetSignal by QR Code
          </ion-button>
        </div>
      </ng-template>
    </ng-container>
  </ng-container>

  <ion-footer class="footer ion-padding" footer *ngIf="isSearchView && addButtonVisible">
    <app-button (buttonClick)="addDeployment()" iconName="plus">Add</app-button>
  </ion-footer>
</app-main-layout>

<ng-template #spinner>
  <app-spinner class="spinner"></app-spinner>
</ng-template>
